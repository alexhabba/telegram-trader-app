spring:
  flyway:
    locations: classpath:db/migration
    schemas: trader
    enabled: true
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    database: postgresql
    properties:
      hibernate:
        jdbc:
          time_zone: Europe/Moscow

  datasource:
    url: jdbc:postgresql://${HOSTNAME:localhost}:${PORT:5432}/${DB_NAME:postgres}?currentSchema=trader
#    url: jdbc:postgresql://${HOSTNAME:localhost}:${PORT:5433}/${DB_NAME:postgres}?currentSchema={spring.flyway.schemas}
#    url: jdbc:postgresql://${HOSTNAME:45.8.251.166}:${PORT:5433}/${RDS_DB_NAME:postgres}?currentSchema=trader
#    url: jdbc:postgresql://${RDS_HOSTNAME:host.docker.internal:${RDS_PORT:5432}/${RDS_DB_NAME:bot}?currentSchema=bot
#    docker run -d --name tickwld -e HOSTNAME=192.168.1.241 -e PORT=5432 tickwld
#    docker run -d --name test -e HOSTNAME=host.docker.internal -e PORT=5432 tickwld
#    docker run -d --name str10 -e strategy=10 -e HOSTNAME=host.docker.internal -e PORT=5433 --restart=always str13
    username: ${RDS_USERNAME:postgres}
    password: ${RDS_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    pool-size: 30
  main:
    allow-circular-references: true

bot:
  name: TradeHelperBot
  token: 6967437002:AAEZds47kCq2KtReJ6gC_Sh-GmMGr8LDId4
  owner: 1

management:
  endpoints.web.exposure.include: 'prometheus, health'
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true

server:
  port: 8080

list.symbol: NOT,BTC,AAVE,BNB,OP,ARB,WLD,SOL,INJ,LINK,APT

key: ${KEY:KEY}
secret: ${SECRET:SECRET}

logging:
  level:
#    root: WARN
    org.springframework: info
    org.apache: info
    com.zaxxer: info
    org.hibernate.SQL: INFO
    o.h.internal.util: info
    o.h.internal.util.EntityPrinter: info
    com.trade.bot.handler.OkxTradeHandler: DEBUG
    org.hibernate.engine.jdbc: info
    org.hibernate: ERROR
    com.bybit.api.client.service: ERROR


accounts: ${ACCOUNTS:{}}

hour: ${HOUR:0}
