spring:
  datasource:
#    url: jdbc:postgresql://${HOSTNAME:localhost}:${PORT:5433}/${DB_NAME:postgres}?currentSchema=trader
#    url: jdbc:postgresql://${HOSTNAME:45.8.251.166}:${PORT:5432}/${DB_NAME:postgres}
    url: jdbc:postgresql://${HOSTNAME:45.8.251.166}:${PORT:5432}/${DB_NAME:postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      schema: ${POSTGRES_SCHEMA:trader}
      pool-name: HikariPoolReader
      maximum-pool-size: ${DB_POOL_SIZE:30}
      auto-commit: true
      connection-timeout: ${DB_IDLE_TIMEOUT:600000}
      minimum-idle: ${DB_IDLE_SIZE:10}
      data-source-properties:
        socketTimeout: 60

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    database: postgresql
    properties:
      hibernate:
        jdbc:
          time_zone: Europe/Moscow

management:
  endpoints.web.exposure.include: 'prometheus, health'
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true

server:
  port: 8091

logging:
  level:
    #    root: WARN
    org.springframework: info
    org.apache: info
    com.zaxxer: info
    org.hibernate.SQL: INFO
    o.h.internal.util: info
    o.h.internal.util.EntityPrinter: info
    com.trade.bot.handler.OkxTradeHandler: DEBUG
    org.hibernate.engine.jdbc: info
    org.hibernate: ERROR
    com.bybit.api.client.service: ERROR


